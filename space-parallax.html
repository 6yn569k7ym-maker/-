<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <title>Космическое путешествие</title>
    
    <style>
        /* Фоновое изображение */
        body {
            background: url('https://raw.githubusercontent.com/6yn569k7ym-maker/-/space-parallax/space-background.png');
            height: 4600px;
            margin: 0;
            padding: 0;
            background-size: cover;
            background-attachment: fixed;
        }
        
        /* Слои параллакса */
        div#parallax-bg-1 {
            position: fixed;
            width: 1200px;
            top: 0;
            left: 50%;
            margin-left: -600px;
            z-index: 1;
        }
        
        div#parallax-bg-2 {
            position: fixed;
            width: 1200px;
            top: 0;
            left: 50%;
            margin-left: -600px;
            z-index: 2;
        }
        
        div#parallax-bg-3 {
            position: fixed;
            width: 960px;
            top: 0;
            left: 50%;
            margin-left: -470px;
            z-index: 3;
        }
        
        div#parallax-bg-3 div {
            background-repeat: no-repeat;
            position: absolute;
            display: block;
            overflow: hidden;
        }
        
        /* === Третий слой (верхний) — размеры уменьшены на 50% === */
        div#bg-3-1 {
            background: url('https://raw.githubusercontent.com/6yn569k7ym-maker/-/space-parallax/space-rocket.png');
            width: 264px;
            height: 378px;
            top: -50px;
            right: 50px;
            background-size: contain;
            background-repeat: no-repeat;
        }
        
        div#bg-3-2 {
            background: url('https://raw.githubusercontent.com/6yn569k7ym-maker/-/space-parallax/space-satellite.png');
            width: 301px;
            height: 291px;
            top: 525px;
            right: 35px;
            background-size: contain;
            background-repeat: no-repeat;
        }
        
        div#bg-3-3 {
            background: url('https://raw.githubusercontent.com/6yn569k7ym-maker/-/space-parallax/space-planet.png');
            width: 423px;
            height: 356px;
            top: 900px;
            right: 70px;
            background-size: contain;
            background-repeat: no-repeat;
        }
        
        div#bg-3-4 {
            background: url('https://raw.githubusercontent.com/6yn569k7ym-maker/-/space-parallax/space-station.png');
            width: 552px;
            height: 342px;
            top: 1400px;
            right: 0px;
            background-size: contain;
            background-repeat: no-repeat;
        }
        
        /* === Второй слой (средний) — размеры уменьшены на 50% === */
        div#parallax-bg-2 div {
            background: url('https://raw.githubusercontent.com/6yn569k7ym-maker/-/space-parallax/space-orbit.png');
            background-repeat: no-repeat;
            position: absolute;
            display: block;
            width: 244px;
            height: 219px;
            overflow: hidden;
            background-size: contain;
        }
        
        /* Позиции для второго слоя */
        div#bg-2-1 { top: 50px; left: -155px; }
        div#bg-2-2 { top: 135px; right: -35px; }
        div#bg-2-3 { top: 435px; left: -150px; }
        div#bg-2-4 { top: 560px; right: -65px; }
        div#bg-2-5 { top: 810px; left: 70px; }
        div#bg-2-6 { top: 360px; left: 170px; }
        
        /* === Первый слой (нижний) — размеры уменьшены на 50% === */
        div#parallax-bg-1 div {
            background-repeat: no-repeat;
            position: absolute;
            display: block;
            width: 244px;
            height: 269px;
            overflow: hidden;
            background-size: contain;
        }
        
        /* Позиции для первого слоя */
        div#bg-1-1 {
            background: url('https://raw.githubusercontent.com/6yn569k7ym-maker/-/space-parallax/space-asteroid.png');
            top: 100px;
            right: 125px;
            background-size: contain;
            background-repeat: no-repeat;
        }
        
        div#bg-1-2 {
            background: url('https://raw.githubusercontent.com/6yn569k7ym-maker/-/space-parallax/space-moon.png');
            top: 210px;
            left: 0px;
            background-size: contain;
            background-repeat: no-repeat;
        }
        
        div#bg-1-3 {
            background: url('https://raw.githubusercontent.com/6yn569k7ym-maker/-/space-parallax/space-asteroid.png');
            top: 425px;
            right: -145px;
            background-size: contain;
            background-repeat: no-repeat;
        }
        
        div#bg-1-4 {
            background: url('https://raw.githubusercontent.com/6yn569k7ym-maker/-/space-parallax/space-moon.png');
            top: 675px;
            left: 100px;
            background-size: contain;
            background-repeat: no-repeat;
        }
        
        div#bg-1-5 {
            background: url('https://raw.githubusercontent.com/6yn569k7ym-maker/-/space-parallax/space-asteroid.png');
            top: 600px;
            left: -100px;
            background-size: contain;
            background-repeat: no-repeat;
        }
        
        /* === Анимация для падающих объектов === */
        .falling-1 {
            animation: fall1 5s infinite;
            position: fixed;
            z-index: 10;
        }
        
        .falling-2 {
            animation: fall2 7s infinite;
            position: fixed;
            z-index: 10;
        }
        
        .falling-3 {
            animation: fall3 4s infinite;
            position: fixed;
            z-index: 10;
        }
        
        .falling-1 img, .falling-2 img, .falling-3 img {
            width: 50%;
            height: auto;
        }
        
        @keyframes fall1 {
            0% { transform: translateY(-80px); }
            100% { transform: translateY(410vh); }
        }
        
        @keyframes fall2 {
            0% { transform: translateY(-100px); }
            100% { transform: translateY(450vh); }
        }
        
        @keyframes fall3 {
            0% { transform: translateY(-50px); }
            100% { transform: translateY(380vh); }
        }
        
        /* Стили для текста */
        .parallax-text {
            font-size: 24px;
            font-weight: bold;
            text-shadow: 1px 1px 2px black;
        }
        
        .text-lightblue {
            color: #00ccff;
        }
        
        .text-red {
            color: red;
        }
    </style>
</head>
<body>

    <!-- Падающие объекты -->
    <div class="falling-1"><img src="https://raw.githubusercontent.com/6yn569k7ym-maker/-/space-parallax/space-star.png" alt="Звезда"></div>
    <div class="falling-2"><img src="https://raw.githubusercontent.com/6yn569k7ym-maker/-/space-parallax/space-asteroid.png" alt="Астероид"></div>
    <div class="falling-3"><img src="https://raw.githubusercontent.com/6yn569k7ym-maker/-/space-parallax/space-moon.png" alt="Луна"></div>

    <!-- Третий слой (верхний) -->
    <div class="parallax-bg" id="parallax-bg-3">
        <div id="bg-3-1"></div>
        <div id="bg-3-2"></div>
        <div id="bg-3-3">
            <p class="parallax-text text-lightblue">Далёкие планеты</p>
        </div>
        <div id="bg-3-4">
            <p class="parallax-text text-red">Новая орбита</p>
        </div>
    </div>

    <!-- Второй слой (средний) -->
    <div class="parallax-bg" id="parallax-bg-2">
        <div id="bg-2-1"></div>
        <div id="bg-2-2"></div>
        <div id="bg-2-3"></div>
        <div id="bg-2-4"></div>
        <div id="bg-2-5">
            <p class="parallax-text text-lightblue">Среди звёзд</p>
        </div>
        <div id="bg-2-6"></div>
    </div>

    <!-- Первый слой (нижний) -->
    <div class="parallax-bg" id="parallax-bg-1">
        <div id="bg-1-1"></div>
        <div id="bg-1-2"></div>
        <div id="bg-1-3"></div>
        <div id="bg-1-4">
            <p class="parallax-text text-red">
                <br />
                К новым мирам!
            </p>
        </div>
        <div id="bg-1-5"></div>
    </div>

    <!-- Подключение jQuery и скрипта -->
    <script src="https://code.jquery.com/jquery-3.6.0.min.js"></script>
    <script>
        jQuery(document).ready(function(){
            $(window).scroll(function(e){
                parallaxScroll();
            });
            
            function parallaxScroll(){
                var scrolled = $(window).scrollTop();
                $('#parallax-bg-1').css('top', (0 - (scrolled * 0.25)) + 'px');
                $('#parallax-bg-2').css('top', (0 - (scrolled * 0.4)) + 'px');
                $('#parallax-bg-3').css('top', (0 - (scrolled * 0.75)) + 'px');
            }
        });
    </script>
</body>
</html>
